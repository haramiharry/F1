name: Round Status Cron

on:
  schedule:
    - cron: "*/15 * * * 4,5,6,0"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger round status check
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/ingestion/cron/round-status" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
